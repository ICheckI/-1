<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#210064" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Battery Charge</title>
  <style>
    :root {
      color-scheme: dark;
      --fill: #ff3447;
      --fill-shadow: rgba(255, 55, 88, .65);
      --percent: 10;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Arial Rounded MT Bold", Inter, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #0e003b; display: flex; justify-content: center; }
    .screen {
      position: relative;
      isolation: isolate;
      width: 100%;
      max-width: 500px;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      background:
        radial-gradient(ellipse 84% 60% at 84% 73%, rgba(108, 0, 236, .42) 0%, transparent 78%),
        radial-gradient(ellipse 65% 55% at 0% 15%, rgba(2, 0, 43, .55) 0%, transparent 95%),
        linear-gradient(158deg, #100039 0%, #1b005d 24%, #2b0085 55%, #4605a9 80%, #4500a1 100%);
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      cursor: pointer;
    }
    .screen::after {
      position: absolute;
      content: "";
      inset: 0;
      pointer-events: none;
      opacity: 0.33;
      background: radial-gradient(ellipse at 50% 43%, transparent 35%, rgba(2,0,27,.22) 100%);
    }
    .content {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: clamp(72px, 13.1dvh, 146px);
    }
    .battery {
      --height: clamp(205px, 37dvh, 332px);
      height: var(--height);
      width: calc(var(--height) * 0.574);
      flex-shrink: 0;
      position: relative;
      filter: drop-shadow(0 0 5px rgba(255,255,255,.13));
    }
    .battery-tip {
      position: absolute;
      z-index: 0;
      width: 36%;
      height: 14px;
      top: -12px;
      left: 32%;
      background: #fff;
      border-radius: 5px 5px 1px 1px;
    }
    .battery-border {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      border: clamp(3px, .47dvh, 4px) solid #fff;
      border-radius: 19px;
      background: rgba(10,0,35,.025);
      box-shadow: 0 0 5px rgba(255,255,255,.22), inset 0 0 3px rgba(255,255,255,.17);
    }
    .battery-liquid {
      position: absolute;
      left: 6px;
      right: 6px;
      bottom: 6px;
      height: max(7%, calc((100% - 12px) * min(var(--percent), 100) / 100));
      border-radius: 12px;
      background: var(--fill);
      box-shadow:
        0 0 11px 2px var(--fill-shadow),
        0 -5px 17px 1px var(--fill-shadow),
        inset 0 3px 4px rgba(255,255,255,.08);
      transition: background-color .35s ease, box-shadow .35s ease;
      will-change: height;
    }
    .battery-liquid::before {
      content: "";
      position: absolute;
      left: 2%;
      right: 2%;
      top: -3px;
      height: 5px;
      border-radius: 60%;
      background: var(--fill);
      filter: blur(4px);
      opacity: .85;
    }
    .charge-number {
      color: #fff;
      margin-top: clamp(32px, 5.2dvh, 54px);
      font-size: clamp(62px, 9.5dvh, 92px);
      font-weight: 770;
      line-height: 1;
      text-align: center;
      letter-spacing: -.035em;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 1px 2px rgba(255,255,255,.10);
    }
    .charge-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: clamp(70px, 10dvh, 92px);
      height: clamp(70px, 10dvh, 92px);
      flex-shrink: 0;
      margin-top: clamp(39px, 7.3dvh, 69px);
      border: 2.5px solid #fff;
      border-radius: 50%;
      background: rgba(101, 0, 206, .18);
      box-shadow: 0 0 4px rgba(255,255,255,.18), inset 0 0 2px rgba(255,255,255,.15);
      color: #fff;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      padding: 0;
      transition: transform .12s ease, box-shadow .2s ease;
      touch-action: none;
    }
    .charge-button svg { display: block; height: 39%; width: 39%; fill: currentColor; }
    .charge-button:active,
    .charge-button.is-pressed { transform: scale(.94); box-shadow: 0 0 24px rgba(255,255,255,.31), inset 0 0 14px rgba(255,255,255,.11); }
    .charge-button:focus-visible { outline: 3px solid rgba(255,255,255,.6); outline-offset: 7px; }
    .battery.is-full { filter: drop-shadow(0 0 9px rgba(0, 238, 157, .5)); }
    .battery.is-overcharged {
      /* A small, constant tremor makes the overflowing energy visible. */
      animation: overcharge-shake .18s linear infinite;
      transform-origin: 50% 50%;
    }
    @keyframes overcharge-shake {
      0%, 100% { transform: translate(0, 0) rotate(0); }
      20% { transform: translate(-1.4px, .4px) rotate(-.5deg); }
      40% { transform: translate(1.2px, -.8px) rotate(.5deg); }
      60% { transform: translate(-1px, .5px) rotate(.4deg); }
      80% { transform: translate(1.5px, -.3px) rotate(-.5deg); }
    }
    /* Real jagged electric arcs, not static lightning-symbol sprites. */
    .electricity {
      position: absolute;
      z-index: 3;
      inset: -95px -108px;
      overflow: visible;
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s ease;
    }
    .battery.is-overcharged .electricity { opacity: 1; }
    .electricity-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .electric-aura {
      position: absolute;
      top: 95px;
      bottom: 95px;
      left: 108px;
      right: 108px;
      border-radius: 24px;
      box-shadow: 0 0 27px 8px rgba(16, 255, 209, .34), 0 0 65px 13px rgba(72, 255, 213, .15);
      animation: electric-aura-pulse 1.25s ease-in-out infinite alternate;
    }
    .electric-aura::before,
    .electric-aura::after {
      content: "";
      position: absolute;
      inset: -12px;
      border: 1px solid rgba(161, 255, 242, .38);
      border-radius: 30px;
      animation: electric-wave 1.1s ease-out infinite;
    }
    .electric-aura::after { animation-delay: .5s; }
    .electric-arc { animation: arc-flicker .4s linear forwards; }
    .electric-arc-glow {
      fill: none;
      stroke: #1afddd;
      stroke-width: 9;
      stroke-linejoin: round;
      stroke-linecap: round;
      opacity: .65;
      filter: blur(3px);
    }
    .electric-arc-core {
      fill: none;
      stroke: #eaffff;
      stroke-width: 2.8;
      stroke-linejoin: round;
      stroke-linecap: round;
      filter: drop-shadow(0 0 3px #55fff5);
    }
    .electric-arc-fork { stroke-width: 1.6; }
    .electric-particle {
      position: absolute;
      z-index: 4;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #f2ffff;
      box-shadow: 0 0 7px 2px #45ffeb, 0 0 15px 3px rgba(48,255,205,.7);
      animation: particle-fly .46s ease-out forwards;
    }
    @keyframes electric-aura-pulse {
      from { opacity: .68; transform: scale(.98); }
      to { opacity: 1; transform: scale(1.045); }
    }
    @keyframes electric-wave {
      0% { opacity: .8; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.21, 1.11); }
    }
    @keyframes arc-flicker {
      0% { opacity: 0; }
      9% { opacity: 1; }
      25% { opacity: .95; }
      35% { opacity: .36; }
      46% { opacity: 1; }
      64% { opacity: .86; }
      100% { opacity: 0; }
    }
    @keyframes particle-fly {
      0% { opacity: .9; transform: translate(0,0) scale(1); }
      100% { opacity: 0; transform: translate(var(--fly-x),var(--fly-y)) scale(.2); }
    }
    @media (max-height: 660px) {
      .content { padding-top: clamp(45px, 10dvh, 85px); }
      .battery { --height: clamp(175px, 35dvh, 235px); }
      .charge-number { margin-top: 24px; font-size: clamp(52px, 9dvh, 65px); }
      .charge-button { margin-top: 30px; width: 68px; height: 68px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .charge-button { transition: none; }
      .battery.is-overcharged, .electric-aura, .electric-aura::before, .electric-aura::after, .electric-arc, .electric-particle { animation: none; }
      .battery.is-overcharged .electricity { opacity: .6; }
    }
  </style>
</head>
<body>
  <main class="screen" id="screen" aria-label="Animated battery charger demo. Tap to charge, tap again to pause.">
    <div class="content">
      <div class="battery" id="battery" role="img" aria-label="Simulated battery level: 10 percent">
        <div class="battery-tip"></div>
        <div class="battery-border">
          <div class="battery-liquid" id="liquid"></div>
        </div>
        <div class="electricity" id="electricity" aria-hidden="true">
          <span class="electric-aura"></span>
          <svg class="electricity-svg" id="electricity-svg" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
          <div id="electric-particles"></div>
        </div>
      </div>
      <div class="charge-number" id="charge-number" aria-live="off">10%</div>
      <button class="charge-button" id="charge-button" type="button" aria-label="Start charging animation" title="Tap to charge">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M13.3 1.75 4.8 13.1h6.15l-1.1 9.15L19.2 10.7h-6.25l.35-8.95Z" /></svg>
      </button>
    </div>
  </main>
  <script>
    (() => {
      'use strict';
      const screen = document.getElementById('screen');
      const battery = document.getElementById('battery');
      const chargeNumber = document.getElementById('charge-number');
      const chargeButton = document.getElementById('charge-button');
      const root = document.documentElement;
      const electricitySvg = document.getElementById('electricity-svg');
      const electricParticles = document.getElementById('electric-particles');
      const svgNS = 'http://www.w3.org/2000/svg';
      const electricityItems = [];
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let lastElectricBurst = 0;
      let lastElectricParticle = 0;
      let electricW = 0;
      let electricH = 0;

      // Keep the original red -> yellow -> green progression, but speed it up
      // and let the percentage keep growing after the old 178% endpoint.
      const keyframes = [
        [0, 10], [500, 18], [1000, 29], [1500, 38],
        [2000, 48], [2500, 57], [3000, 68], [3500, 77],
        [4000, 87], [4500, 97], [5000, 111], [5500, 135],
        [6000, 171], [6400, 178]
      ];
      const speedMultiplier = 1.25; // 25% faster than the original animation.
      const lastKeyframe = keyframes[keyframes.length - 1];
      const extraChargePerSecond = 30;
      let value = 10;
      let elapsed = 0;
      let playing = false;
      let frameID = 0;
      let previousFrame = 0;
      let pointerDownAt = 0;
      let startedFromThisPress = false;

      function valueAt(ms) {
        const acceleratedMs = ms * speedMultiplier;
        if (acceleratedMs <= 0) return 10;
        for (let i = 1; i < keyframes.length; ++i) {
          const [endTime, endValue] = keyframes[i];
          if (acceleratedMs <= endTime) {
            const [startTime, startValue] = keyframes[i - 1];
            return startValue + (endValue - startValue) * ((acceleratedMs - startTime) / (endTime - startTime));
          }
        }
        // No maximum: continue adding charge as long as the animation runs.
        return lastKeyframe[1] + (acceleratedMs - lastKeyframe[0]) * extraChargePerSecond / 1000;
      }
      function draw(next) {
        value = Math.max(10, next);
        const rounded = Math.round(value);
        chargeNumber.textContent = `${rounded}%`;
        battery.setAttribute('aria-label', `Simulated battery level: ${rounded} percent`);
        // Keep long, unlimited numbers inside a narrow mobile screen.
        chargeNumber.style.fontSize = rounded >= 100000 ? 'clamp(34px, 6dvh, 55px)' :
          rounded >= 10000 ? 'clamp(44px, 7dvh, 67px)' : '';
        root.style.setProperty('--percent', String(Math.min(value,100)));
        if (value < 34) {
          root.style.setProperty('--fill', '#ff354b');
          root.style.setProperty('--fill-shadow', 'rgba(255, 57, 91, .7)');
        } else if (value < 84) {
          root.style.setProperty('--fill', '#ffd41d');
          root.style.setProperty('--fill-shadow', 'rgba(255, 218, 34, .66)');
        } else {
          root.style.setProperty('--fill', '#00d694');
          root.style.setProperty('--fill-shadow', 'rgba(0, 255, 173, .65)');
        }
        battery.classList.toggle('is-full', rounded >= 100);
        battery.classList.toggle('is-overcharged', value > 100);
      }
      // Each burst draws brand-new branching, jagged arcs emanating directly
      // from the battery shell. All geometry is local, so phones scale well.
      function updateElectricSize() {
        electricW = battery.clientWidth + 216;
        electricH = battery.clientHeight + 190;
        electricitySvg.setAttribute('viewBox', `0 0 ${electricW} ${electricH}`);
      }
      function arcPoints(startX, startY, dirX, dirY, length, segments = 7) {
        const magnitude = Math.hypot(dirX, dirY) || 1;
        dirX /= magnitude;
        dirY /= magnitude;
        const sidewaysX = -dirY, sidewaysY = dirX;
        const points = [[startX, startY]];
        for (let i = 1; i <= segments; i++) {
          const t = i / segments;
          const jitter = i === segments ? (Math.random() - .5) * 10 : (Math.random() - .5) * 25;
          points.push([
            startX + dirX * length * t + sidewaysX * jitter,
            startY + dirY * length * t + sidewaysY * jitter
          ]);
        }
        return points;
      }
      function toPath(points) {
        return points.map(([x, y], i) => `${i ? 'L' : 'M'}${x.toFixed(1)} ${y.toFixed(1)}`).join(' ');
      }
      function addStrokes(group, shape, fork = false) {
        const halo = document.createElementNS(svgNS, 'path');
        halo.setAttribute('d', shape);
        halo.setAttribute('class', 'electric-arc-glow');
        group.appendChild(halo);
        const core = document.createElementNS(svgNS, 'path');
        core.setAttribute('d', shape);
        core.setAttribute('class', fork ? 'electric-arc-core electric-arc-fork' : 'electric-arc-core');
        group.appendChild(core);
      }
      function spawnElectricArc(now, power) {
        const w = battery.clientWidth, h = battery.clientHeight;
        const side = Math.floor(Math.random() * 3);
        const x0 = 108, y0 = 95;
        let x, y, dx, dy;
        if (side === 0) { // left
          x = x0; y = y0 + h * (.14 + Math.random() * .72);
          dx = -1; dy = (Math.random() - .5) * .75;
        } else if (side === 1) { // right
          x = x0 + w; y = y0 + h * (.14 + Math.random() * .72);
          dx = 1; dy = (Math.random() - .5) * .75;
        } else if (side === 2) { // top
          x = x0 + w * (.12 + Math.random() * .76); y = y0;
          dx = (Math.random() - .5) * 1.0; dy = -1;
        } else { // bottom
          x = x0 + w * (.12 + Math.random() * .76); y = y0 + h;
          dx = (Math.random() - .5) * 1.0; dy = 1;
        }
        const length = 43 + Math.random() * (28 + 20 * power);
        const primary = arcPoints(x, y, dx, dy, length);
        const group = document.createElementNS(svgNS, 'g');
        group.setAttribute('class', 'electric-arc');
        addStrokes(group, toPath(primary));
        // Smaller forks make the path look like an actual high-voltage discharge.
        for (let j = 0; j < (Math.random() < .55 + power * .25 ? 2 : 1); j++) {
          const split = 2 + Math.floor(Math.random() * 3);
          const [bx, by] = primary[split];
          const sign = Math.random() < .5 ? -1 : 1;
          const branch = arcPoints(bx, by, dx - dy * sign * 1.15, dy + dx * sign * 1.15,
            length * (.2 + Math.random() * .25), 3);
          addStrokes(group, toPath(branch), true);
        }
        electricitySvg.appendChild(group);
        electricityItems.push({node: group, time: now});
      }
      function spawnElectricParticle(now) {
        const side = Math.floor(Math.random() * 3);
        const w = battery.clientWidth, h = battery.clientHeight;
        const dot = document.createElement('span');
        dot.className = 'electric-particle';
        let x, y, dx, dy;
        if (side === 0 || side === 1) {
          x = side === 0 ? 108 : 108 + w;
          y = 95 + Math.random() * h;
          dx = side === 0 ? -(20 + Math.random() * 50) : 20 + Math.random() * 50;
          dy = (Math.random() - .5) * 60;
        } else {
          x = 108 + Math.random() * w;
          y = side === 2 ? 95 : 95 + h;
          dx = (Math.random() - .5) * 65;
          dy = side === 2 ? -(15 + Math.random() * 48) : 15 + Math.random() * 48;
        }
        dot.style.left = `${x}px`;
        dot.style.top = `${y}px`;
        dot.style.setProperty('--fly-x', `${dx}px`);
        dot.style.setProperty('--fly-y', `${dy}px`);
        electricParticles.appendChild(dot);
        electricityItems.push({node: dot, time: now});
      }
      function electricTick(now) {
        for (let i = electricityItems.length - 1; i >= 0; i--) {
          if (now - electricityItems[i].time > 470) {
            electricityItems[i].node.remove();
            electricityItems.splice(i, 1);
          }
        }
        if (reduceMotion || value <= 100 || !playing) return;
        const power = Math.min(1, (value - 100) / 270);
        const interval = 115 - 42 * power;
        if (now - lastElectricBurst >= interval) {
          lastElectricBurst = now;
          const count = Math.random() < (.45 + power * .25) ? 2 : 1;
          for (let i = 0; i < count; i++) spawnElectricArc(now, power);
        }
        if (now - lastElectricParticle >= 72) {
          lastElectricParticle = now;
          spawnElectricParticle(now);
        }
      }
      function pause() {
        playing = false;
        cancelAnimationFrame(frameID);
        frameID = 0;
        previousFrame = 0;
        chargeButton.classList.remove('is-pressed');
        chargeButton.setAttribute('aria-label', 'Resume charging animation');
      }
      function tick(now) {
        if (!playing) return;
        if (previousFrame) elapsed += Math.min(now - previousFrame, 100);
        previousFrame = now;
        draw(valueAt(elapsed));
        electricTick(now);
        frameID = requestAnimationFrame(tick);
      }
      function start() {
        if (playing) return;
        playing = true;
        previousFrame = 0;
        chargeButton.classList.add('is-pressed');
        chargeButton.setAttribute('aria-label', 'Pause charging animation');
        frameID = requestAnimationFrame(tick);
      }

      // A quick tap starts/pauses the automatic animation.
      // Keeping a finger down for >350ms charges only until released, as on video.
      screen.addEventListener('pointerdown', (event) => {
        if (event.pointerType === 'mouse' && event.button !== 0) return;
        event.preventDefault();
        pointerDownAt = performance.now();
        startedFromThisPress = !playing;
        if (startedFromThisPress) start();
        if (event.pointerType !== 'mouse') {
          try { screen.setPointerCapture(event.pointerId); } catch (_) {}
        }
      });
      screen.addEventListener('pointerup', (event) => {
        if (!pointerDownAt) return;
        const heldFor = performance.now() - pointerDownAt;
        pointerDownAt = 0;
        if (heldFor >= 350) {
          pause();
        } else if (!startedFromThisPress) {
          pause();
        }
        startedFromThisPress = false;
      });
      screen.addEventListener('pointercancel', () => {
        pointerDownAt = 0;
        startedFromThisPress = false;
        pause();
      });
      chargeButton.addEventListener('keydown', (event) => {
        if (event.code === 'Enter' || event.code === 'Space') {
          event.preventDefault();
          if (playing) pause(); else start();
        }
      });
      screen.addEventListener('contextmenu', event => event.preventDefault());
      document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
      window.addEventListener('resize', updateElectricSize);
      updateElectricSize();
      draw(10);
    })();
  </script>
</body>
</html>
